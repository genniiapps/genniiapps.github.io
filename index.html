<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeNNii Apps</title>
<meta name="description" content="Small useful tools by GeNNii Apps.">
<link rel="icon" href="limits/icon.png">
<style>
@font-face{font-family:"Unbounded";src:url("fonts/unbounded-latin.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{--bg:#000;--card:#0e0e10;--fg:#ededf0;--mute:#9a9aa3;--line:#1f1f24;--acc:#f5a524;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:64px 16px}
main{max-width:44rem;margin:0 auto;animation:in .4s cubic-bezier(0.05,0.7,0.1,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:fade .3s both}@keyframes fade{from{opacity:0}to{opacity:1}}}
h1{font:600 clamp(1.8rem,6vw,2.6rem)/1.1 "Unbounded",system-ui,sans-serif;margin:0 0 8px}
p{color:var(--mute);margin:0 0 32px}
a.card{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);text-decoration:none;transition:border-color .2s cubic-bezier(0.2,0,0,1)}
a.card:hover,a.card:focus-visible{border-color:var(--acc)}
a.card img{width:48px;height:48px;border-radius:12px}
a.card b{font-family:"Unbounded",system-ui,sans-serif;font-weight:600}
a.card span{display:block;color:var(--mute);font-size:.92rem}
</style>
</head>
<body>
<main>
<h1>GeNNii Apps</h1>
<p>Small useful tools.</p>
<a class="card" href="limits/privacy/"><img src="limits/icon.png" alt=""><div><b>Limits</b><span>Your Claude and Codex usage limits in the Chrome toolbar. Privacy policy →</span></div></a>
</main>
</body>
</html>
